- hosts: localhost
  tasks:
    - name: Install homebrew
      include_role:
        name: geerlingguy.mac.homebrew

    - name: Make sure homebrew bin is in path
      ansible.builtin.lineinfile:
        path: /etc/paths
        state: present
        line: "/opt/homebrew/bin"
      become: true
      become_user: root

    - name: Install core packages via brew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
      ignore_errors: yes
      with_items:
        - alfred
        - vanilla
        - rocket
        - figma
        - google-chrome
        - slack
        - cursor
        - vlc
        - zoom
        - rectangle
        - jetbrains-toolbox
        - warp
        - orbstack
        - notion
        - notion-calendar
        - font-jetbrains-mono
        - postman
        - zed
        - zen
        - chatgpt
        - claude
        - istat-menus

    - name: "Install homebrew packages"
      community.general.homebrew:
        name:
          [
            "autoconf",
            "automake",
            "bat",
            "coreutils",
            "curl",
            "gnu-time",
            "gpg",
            "htop",
            "imagemagick",
            "libtool",
            "libxslt",
            "libyaml",
            "jq",
            "mas",
            "openssl",
            "git",
            "gh",
            "pkg-config",
            "readline",
            "sqlite3",
            "tmux",
            "unzip",
            "vim",
            "zlib",
            "zsh",
          ]
        state: present
        update_homebrew: yes

    - name: Check whether full Xcode is installed
      stat:
        path: /Applications/Xcode.app
      register: xcode_app

    - name: Accept Xcode license
      become: true
      command: xcodebuild -license accept
      when: xcode_app.stat.exists
      changed_when: true

    - name: Setup ZSH and Oh My ZSH
      import_tasks: tasks/common/zsh.yml

    - name: Setup mise
      import_tasks: tasks/common/mise.yml

    - name: Setup pnpm
      import_tasks: tasks/common/pnpm.yml

    - name: Create a default ZSH configuration
      template:
        src: templates/.zshrc.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.zshrc
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Ensure .claude directory exists
      file:
        path: /Users/{{ lookup('env', 'USER') }}/.claude
        state: directory
        owner: "{{ lookup('env', 'USER') }}"

    - name: Create Claude Code settings
      template:
        src: templates/claude-settings.json.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.claude/settings.json
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Ensure OpenCode config directory exists
      file:
        path: /Users/{{ lookup('env', 'USER') }}/.config/opencode
        state: directory
        owner: "{{ lookup('env', 'USER') }}"

    - name: Create OpenCode settings
      template:
        src: templates/opencode.json.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.config/opencode/opencode.json
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Ensure Zed config directory exists
      file:
        path: /Users/{{ lookup('env', 'USER') }}/.config/zed
        state: directory
        owner: "{{ lookup('env', 'USER') }}"

    - name: Create Zed settings
      template:
        src: templates/zed-settings.json.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.config/zed/settings.json
        owner: "{{ lookup('env', 'USER') }}"
        force: yes
