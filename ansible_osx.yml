- hosts: localhost
  vars:
    # Run modules on Ansible's own Python, not the outdated system python3
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Prefer the login environment's home, then the passwd home. Avoids a
    # hardcoded /Users/$USER path when USER is unset or the home directory differs.
    user_home: "{{ ansible_facts['env']['HOME'] | default(ansible_facts['user_dir'], true) }}"
    dotfiles_dir: "{{ user_home }}/MyTerminalConfig"
    # Default on: Alfred replaces Spotlight search. Set this to false to keep Spotlight.
    # `mdutil -a -d` sets kMDConfigSearchLevelOff: indexing and searching both stop.
    # `-i off` is not used. On its own it leaves search on, and `mdutil -a -i off`
    # turns search back on for volumes already at "Indexing and searching disabled."
    # `-E` erases the index, so it is not used.
    # Re-enable with: sudo mdutil -a -i on
    osx_disable_spotlight: true
  tasks:
    # Before Homebrew, so indexing is off for the rest of the install.
    - name: Disable Spotlight
      become: true
      when: osx_disable_spotlight | bool
      vars:
        spotlight_disabled_status: Indexing and searching disabled
      block:
        - name: Check Spotlight status on all volumes
          command: mdutil -a -s
          register: spotlight_status
          changed_when: false
          failed_when: spotlight_status.rc != 0

        # One phrase. Any other indexing line, including ones that do not match
        # "Indexing enabled." exactly, still needs disabling.
        - name: Record whether every Spotlight volume is already disabled
          set_fact:
            spotlight_fully_disabled: >-
              {{ (status_lines | length) > 0
                 and (status_lines
                      | reject('match', '^' ~ spotlight_disabled_status)
                      | list | length) == 0 }}
          vars:
            status_lines: >-
              {{ spotlight_status.stdout_lines | map('trim')
                 | select('search', 'Indexing') | list }}
          changed_when: false

        - name: Disable Spotlight indexing and searching
          command: mdutil -a -d
          when: not (spotlight_fully_disabled | bool)
          register: spotlight_disable
          changed_when: spotlight_disable.rc == 0
          failed_when: spotlight_disable.rc != 0

        - name: Re-check Spotlight status after disabling it
          command: mdutil -a -s
          when: not (spotlight_fully_disabled | bool)
          register: spotlight_status_after
          changed_when: false
          failed_when: >-
            spotlight_status_after.rc != 0
            or (after_lines | reject('match', '^' ~ spotlight_disabled_status)
                | list | length) > 0
            or (after_lines | length) == 0
          vars:
            after_lines: >-
              {{ spotlight_status_after.stdout_lines | default([]) | map('trim')
                 | select('search', 'Indexing') | list }}

    - name: Install homebrew
      include_role:
        name: geerlingguy.mac.homebrew

    - name: Install core packages via brew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
        install_options: adopt
      ignore_errors: yes
      with_items:
        - alfred
        - bartender
        - rocket
        - figma
        - google-chrome
        - slack
        - cursor
        - vlc
        - spotify
        - zoom
        - rectangle
        - jetbrains-toolbox
        - warp
        - orbstack
        - notion
        - notion-calendar
        - font-jetbrains-mono
        - postman
        - zed
        - zen
        - chatgpt
        - claude
        - stats
        - gcloud-cli
        - grammarly-desktop

    - name: "Install homebrew packages"
      community.general.homebrew:
        name:
          [
            "autoconf",
            "automake",
            "bat",
            "bash",
            "coreutils",
            "curl",
            "gnu-time",
            "gpg",
            "htop",
            "imagemagick",
            "libtool",
            "libxslt",
            "libyaml",
            "jq",
            "mas",
            "openssl",
            "git",
            "gh",
            "pkg-config",
            "readline",
            "sqlite",
            "tmux",
            "unzip",
            "vim",
            "zlib",
            "zsh",
          ]
        state: present
        update_homebrew: yes

    - name: Add Homebrew taps
      community.general.homebrew_tap:
        name: hashicorp/tap
        state: present

    - name: Install development tools via homebrew
      community.general.homebrew:
        name:
          - hashicorp/tap/terraform
          - postgresql@18
          - php
        state: present

    - name: Check whether full Xcode is installed
      stat:
        path: /Applications/Xcode.app
      register: xcode_app

    - name: Accept Xcode license
      become: true
      command: xcodebuild -license accept
      when: xcode_app.stat.exists
      changed_when: true

    - name: Setup ZSH and Oh My ZSH
      import_tasks: tasks/common/zsh.yml

    - name: Setup mise
      import_tasks: tasks/common/mise.yml

    - name: Setup pnpm
      import_tasks: tasks/common/pnpm.yml

    - name: Setup Claude Code
      import_tasks: tasks/common/claude-code.yml

    - name: Setup OpenCode
      import_tasks: tasks/common/opencode.yml

    - name: Setup bun
      import_tasks: tasks/common/bun.yml

    - name: Clone dotfiles
      git:
        repo: https://github.com/josechirivella/dotfiles.git
        dest: "{{ dotfiles_dir }}"
        update: no

    - name: Check whether .zshrc already points at the dotfiles
      stat:
        path: "{{ user_home }}/.zshrc"
      register: zshrc

    # install.sh re-links .zshrc on every run, so only run it until it's linked
    - name: Install dotfiles
      command: sh src/install.sh
      args:
        chdir: "{{ dotfiles_dir }}"
      when: zshrc.stat.lnk_source | default('') != dotfiles_dir ~ '/.zshrc'

    # Explicit 0700: unset mode follows Ansible's default, which changed across
    # releases and can create a directory without the execute bit. The template
    # task then fails because it cannot write inside that directory.
    - name: Ensure .claude directory exists
      file:
        path: "{{ user_home }}/.claude"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0700"

    # force replaces hand edits on re-run so the file matches this repo (previous behavior).
    - name: Create Claude Code settings
      template:
        src: templates/claude-settings.json.j2
        dest: "{{ user_home }}/.claude/settings.json"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0600"
        force: true
        validate: "{{ ansible_playbook_python }} -m json.tool %s"

    # ~/.config is shared. Create it as 0755 so a missing parent does not
    # inherit 0700 from the opencode directory (Ansible applies that mode to
    # parents it creates). 0755 still has the execute bit.
    - name: Ensure .config directory exists
      file:
        path: "{{ user_home }}/.config"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0755"

    - name: Ensure OpenCode config directory exists
      file:
        path: "{{ user_home }}/.config/opencode"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0700"

    # force replaces hand edits on re-run so the file matches this repo (previous behavior).
    - name: Create OpenCode settings
      template:
        src: templates/opencode.json.j2
        dest: "{{ user_home }}/.config/opencode/opencode.json"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0600"
        force: true
        validate: "{{ ansible_playbook_python }} -m json.tool %s"

    - name: Ensure Zed config directory exists
      file:
        path: "{{ user_home }}/.config/zed"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0755"

    # JSONC (// comments), so this is not validated with json.tool.
    # force replaces hand edits on re-run so the file matches this repo (previous behavior).
    - name: Create Zed settings
      template:
        src: templates/zed-settings.json.j2
        dest: "{{ user_home }}/.config/zed/settings.json"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0600"
        force: true
