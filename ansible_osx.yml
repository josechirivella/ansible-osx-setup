- hosts: localhost
  vars:
    # Run modules on Ansible's own Python, not the outdated system python3
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    dotfiles_dir: /Users/{{ lookup('env', 'USER') }}/MyTerminalConfig
    # Prefer the login environment's home, then the passwd home. Avoids a
    # hardcoded /Users/$USER path when USER is unset or the home directory differs.
    user_home: "{{ ansible_facts['env']['HOME'] | default(ansible_facts['user_dir'], true) }}"
    # Opt-in. Spotlight stays on unless this is true.
    # `mdutil -i off` stops indexing but leaves the existing index searchable.
    # `mdutil -d` disables searching as well. `-E` is not used: it erases the index.
    # Re-enable with: sudo mdutil -a -i on
    osx_disable_spotlight: false
  tasks:
    - name: Install homebrew
      include_role:
        name: geerlingguy.mac.homebrew

    - name: Install core packages via brew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
        install_options: adopt
      ignore_errors: yes
      with_items:
        - alfred
        - bartender
        - rocket
        - figma
        - google-chrome
        - slack
        - cursor
        - vlc
        - spotify
        - zoom
        - rectangle
        - jetbrains-toolbox
        - warp
        - orbstack
        - notion
        - notion-calendar
        - font-jetbrains-mono
        - postman
        - zed
        - zen
        - chatgpt
        - claude
        - stats
        - gcloud-cli
        - grammarly-desktop

    - name: "Install homebrew packages"
      community.general.homebrew:
        name:
          [
            "autoconf",
            "automake",
            "bat",
            "bash",
            "coreutils",
            "curl",
            "gnu-time",
            "gpg",
            "htop",
            "imagemagick",
            "libtool",
            "libxslt",
            "libyaml",
            "jq",
            "mas",
            "openssl",
            "git",
            "gh",
            "pkg-config",
            "readline",
            "sqlite",
            "tmux",
            "unzip",
            "vim",
            "zlib",
            "zsh",
          ]
        state: present
        update_homebrew: yes

    - name: Add Homebrew taps
      community.general.homebrew_tap:
        name: hashicorp/tap
        state: present

    - name: Install development tools via homebrew
      community.general.homebrew:
        name:
          - hashicorp/tap/terraform
          - postgresql@18
          - php
        state: present

    - name: Check whether full Xcode is installed
      stat:
        path: /Applications/Xcode.app
      register: xcode_app

    - name: Accept Xcode license
      become: true
      command: xcodebuild -license accept
      when: xcode_app.stat.exists
      changed_when: true

    # "Indexing enabled." is on. "Indexing disabled." is -i off (search still works).
    # "Indexing and searching disabled." is the steady state after -d.
    # -i off runs first; -d runs last so searching stays off.
    - name: Disable Spotlight
      become: true
      when: osx_disable_spotlight | bool
      block:
        - name: Check Spotlight status on all volumes
          command: mdutil -a -s
          register: spotlight_status
          changed_when: false
          failed_when: "'Indexing' not in (spotlight_status.stdout | default(''))"

        - name: Record Spotlight volumes that are still active
          set_fact:
            spotlight_indexing_enabled: >-
              {{ spotlight_status.stdout_lines | map('trim')
                 | select('in', ['Indexing enabled.', 'Indexing enabled'])
                 | list | length > 0 }}
            spotlight_not_fully_disabled: >-
              {{ spotlight_status.stdout_lines | map('trim')
                 | select('in', [
                     'Indexing enabled.',
                     'Indexing enabled',
                     'Indexing disabled.',
                     'Indexing disabled'
                   ])
                 | list | length > 0 }}
          changed_when: false

        - name: Turn Spotlight indexing off on all volumes
          command: mdutil -a -i off
          when: spotlight_indexing_enabled | bool
          register: spotlight_index_off
          changed_when: "'Indexing disabled' in spotlight_index_off.stdout"
          failed_when: spotlight_index_off.rc != 0 and 'disabled' not in (spotlight_index_off.stdout | default(''))

        - name: Disable Spotlight searching on all volumes
          command: mdutil -a -d
          when: spotlight_not_fully_disabled | bool
          register: spotlight_search_off
          changed_when: "'Indexing and searching disabled' in spotlight_search_off.stdout"
          failed_when: spotlight_search_off.rc != 0 and 'Indexing and searching disabled' not in (spotlight_search_off.stdout | default(''))

    - name: Setup ZSH and Oh My ZSH
      import_tasks: tasks/common/zsh.yml

    - name: Setup mise
      import_tasks: tasks/common/mise.yml

    - name: Setup pnpm
      import_tasks: tasks/common/pnpm.yml

    - name: Setup Claude Code
      import_tasks: tasks/common/claude-code.yml

    - name: Setup OpenCode
      import_tasks: tasks/common/opencode.yml

    - name: Setup bun
      import_tasks: tasks/common/bun.yml

    - name: Clone dotfiles
      git:
        repo: https://github.com/josechirivella/dotfiles.git
        dest: "{{ dotfiles_dir }}"
        update: no

    - name: Check whether .zshrc already points at the dotfiles
      stat:
        path: /Users/{{ lookup('env', 'USER') }}/.zshrc
      register: zshrc

    # install.sh re-links .zshrc on every run, so only run it until it's linked
    - name: Install dotfiles
      command: sh src/install.sh
      args:
        chdir: "{{ dotfiles_dir }}"
      when: zshrc.stat.lnk_source | default('') != dotfiles_dir ~ '/.zshrc'

    # Explicit 0700: unset mode follows Ansible's default, which changed across
    # releases and can create a directory without the execute bit. The template
    # task then fails because it cannot write inside that directory.
    - name: Ensure .claude directory exists
      file:
        path: "{{ user_home }}/.claude"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0700"

    - name: Create Claude Code settings
      template:
        src: templates/claude-settings.json.j2
        dest: "{{ user_home }}/.claude/settings.json"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0600"
        force: true
        validate: "{{ ansible_playbook_python }} -m json.tool %s"

    # Creating the nested directory with a mode also creates missing parents
    # (~/.config) with that mode, so .config stays traversable.
    - name: Ensure OpenCode config directory exists
      file:
        path: "{{ user_home }}/.config/opencode"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0700"

    - name: Create OpenCode settings
      template:
        src: templates/opencode.json.j2
        dest: "{{ user_home }}/.config/opencode/opencode.json"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: "0600"
        force: true
        validate: "{{ ansible_playbook_python }} -m json.tool %s"

    - name: Ensure Zed config directory exists
      file:
        path: /Users/{{ lookup('env', 'USER') }}/.config/zed
        state: directory
        owner: "{{ lookup('env', 'USER') }}"

    - name: Create Zed settings
      template:
        src: templates/zed-settings.json.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.config/zed/settings.json
        owner: "{{ lookup('env', 'USER') }}"
        force: yes
