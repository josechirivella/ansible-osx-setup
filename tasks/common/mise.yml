---
- name: Install mise
  shell: curl -fsSL https://mise.run | sh
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.local/bin/mise"

- name: Ensure mise config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/mise"
    state: directory

- name: Create mise config
  template:
    src: templates/mise-config.toml.j2
    dest: "{{ ansible_env.HOME }}/.config/mise/config.toml"

- name: Install runtimes defined in mise config
  command: "{{ ansible_env.HOME }}/.local/bin/mise install"
  changed_when: false
