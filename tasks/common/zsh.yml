---
- name: Get the path to ZSH
  become: false
  local_action: command which zsh
  register: zsh_path

- name: "Ensure ZSH is in allowed shells"
  lineinfile:
    path: /etc/shells
    line: "{{ zsh_path.stdout }}"
  become: true

# user_home comes from the macOS playbook. Fall back when it is unset
# (Ubuntu playbook) to HOME, then the passwd home.
- name: Install Oh My ZSH
  shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ user_home | default(ansible_facts['env']['HOME'] | default(ansible_facts['user_dir'], true), true) }}/.oh-my-zsh"

- name: Set ZSH as the default shell
  shell: chsh -s $(which zsh) {{ ansible_facts['user_id'] }}
  become: true
