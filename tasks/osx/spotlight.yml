---
# -i off only stops indexing ("Indexing disabled.") and leaves search on.
# -d disables Spotlight activity ("Indexing and searching disabled.").
# The mdutil usage text re-enables -d with -i on. -E erases the store and
# rebuilds it when indexing is on, so the index is left in place.
#
# Writes are per volume. mdutil -a -i off would move every volume, including
# one that is already fully disabled, back to indexing-off / search-on.
# A follow-up mdutil -a -s is what marks the play changed. A volume that
# stays "Indexing disabled." (some external and Time Machine disks reject
# -d) does not count as a change.
# Turn Spotlight back on with: sudo mdutil -a -i on

- name: Disable Spotlight when osx_disable_spotlight is true
  when: osx_disable_spotlight | default(false) | bool
  block:
    - name: Check Spotlight status on all volumes
      become: true
      command: mdutil -a -s
      register: spotlight_before
      changed_when: false
      failed_when: >-
        spotlight_before.rc != 0
        and 'Indexing' not in (spotlight_before.stdout | default(''))
        and 'disabled' not in (spotlight_before.stdout | default(''))

    - name: Parse the initial Spotlight status
      include_tasks: tasks/osx/spotlight_parse.yml
      vars:
        spotlight_status_text: "{{ spotlight_before.stdout | default('') }}"

    - name: Record the Spotlight status before changes
      set_fact:
        spotlight_volumes_before: "{{ spotlight_parsed_volumes }}"
      changed_when: false

    - name: Fail when Spotlight status cannot be parsed
      fail:
        msg: >-
          mdutil -a -s did not report a per-volume Spotlight status, so
          indexing was left unchanged.
      when: spotlight_volumes_before | rejectattr('path', 'equalto', '') | list | length == 0

    - name: Record volumes whose indexing is on
      set_fact:
        spotlight_indexing_volumes: >-
          {{
            spotlight_volumes_before
            | rejectattr('path', 'equalto', '')
            | selectattr('status', 'equalto', 'Indexing enabled.')
            | list
          }}
      changed_when: false

    # Indexing-on volumes need -d after -i off. Volumes already at
    # "Indexing disabled." still allow search, so they need -d too.
    # Volumes that are already "Indexing and searching disabled." are absent
    # from both lists and are not touched.
    - name: Record volumes whose Spotlight activity is still on
      set_fact:
        spotlight_activity_volumes: >-
          {{
            spotlight_indexing_volumes
            + (
                spotlight_volumes_before
                | rejectattr('path', 'equalto', '')
                | selectattr('status', 'equalto', 'Indexing disabled.')
                | list
              )
          }}
      changed_when: false

    - name: Turn off Spotlight indexing on volumes that are indexing
      become: true
      command:
        argv:
          - mdutil
          - -i
          # Quoted: a bare off is boolean false in YAML.
          - "off"
          - "{{ item.path }}"
      loop: "{{ spotlight_indexing_volumes }}"
      loop_control:
        label: "{{ item.path }}"
      when: spotlight_indexing_volumes | length > 0
      changed_when: false
      failed_when: false

    - name: Disable Spotlight activity on volumes that still allow search
      become: true
      command:
        argv:
          - mdutil
          - -d
          - "{{ item.path }}"
      loop: "{{ spotlight_activity_volumes }}"
      loop_control:
        label: "{{ item.path }}"
      when: spotlight_activity_volumes | length > 0
      changed_when: false
      failed_when: false

    - name: Re-check Spotlight status on all volumes
      become: true
      command: mdutil -a -s
      register: spotlight_after
      changed_when: false
      failed_when: >-
        spotlight_after.rc != 0
        and 'Indexing' not in (spotlight_after.stdout | default(''))
        and 'disabled' not in (spotlight_after.stdout | default(''))
      when: >-
        spotlight_indexing_volumes | length > 0
        or spotlight_activity_volumes | length > 0

    - name: Parse Spotlight status after the changes
      include_tasks: tasks/osx/spotlight_parse.yml
      vars:
        spotlight_status_text: "{{ spotlight_after.stdout | default('') }}"
      when: spotlight_after is defined and spotlight_after is not skipped

    - name: Record whether Spotlight status changed
      set_fact:
        spotlight_status_changed: >-
          {{
            (
              spotlight_volumes_before
              | rejectattr('path', 'equalto', '')
              | items2dict(key_name='path', value_name='status')
            )
            !=
            (
              spotlight_parsed_volumes
              | rejectattr('path', 'equalto', '')
              | items2dict(key_name='path', value_name='status')
            )
          }}
      changed_when: spotlight_status_changed | bool
      when: spotlight_after is defined and spotlight_after is not skipped

    - name: Fail if Spotlight indexing is still enabled where it was turned off
      fail:
        msg: >-
          Spotlight indexing is still enabled on
          {{ spotlight_still_indexing | map(attribute='path') | join(', ') }}.
      vars:
        spotlight_still_indexing: >-
          {{
            spotlight_parsed_volumes
            | selectattr('status', 'equalto', 'Indexing enabled.')
            | selectattr('path', 'in', spotlight_indexing_volumes | map(attribute='path') | list)
            | list
          }}
      when:
        - spotlight_after is defined
        - spotlight_after is not skipped
        - spotlight_still_indexing | length > 0
